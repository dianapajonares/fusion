version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user_test
      POSTGRES_PASSWORD: '123'
      POSTGRES_DB: db_test
    ports:
      - "5432:5432" # Puerto estándar, asumimos que no hay conflicto local
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: